name: CI Pipeline

on:
  push:
    branches: [ main, master, "feature/**", "fix/**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  code-quality:
    name: Lint & Docker Config Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Code Formatting Check (Black)
        run: |
          black --check --diff dags/ glue_jobs/ tests/ || true

      - name: Lint Python Code (Flake8)
        run: |
          # Stop build if syntax errors or undefined names exist
          flake8 dags/ glue_jobs/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Validate Docker Compose Configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
          echo "Docker compose configuration is valid."

      - name: Validate Shell Script Syntax
        run: |
          bash -n scripts/*.sh
          echo "All shell scripts passed syntax checks."

  test-airflow-dags:
    name: Airflow DAG Integrity Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Airflow Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install apache-airflow==2.9.0 --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.9.0/constraints-3.10.txt"
          pip install -r docker/airflow/requirements.txt

      - name: Test Airflow DAG Import Integrity
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
          AIRFLOW__CORE__UNIT_TEST_MODE: "True"
        run: |
          python -c "
          from airflow.models import DagBag
          dagbag = DagBag(dag_folder='dags/', include_examples=False)
          assert len(dagbag.import_errors) == 0, f'DAG Import Errors: {dagbag.import_errors}'
          print(f'Successfully validated {len(dagbag.dags)} DAG(s): {list(dagbag.dags.keys())}')
          "

  test-glue-pyspark:
    name: PySpark & Chispa Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 11 (Required for PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "11"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install PySpark & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyspark==3.3.0
          pip install -r docker/glue/requirements.txt

      - name: Run PyTest with Chispa
        env:
          AWS_ACCESS_KEY_ID: mock_access_key
          AWS_SECRET_ACCESS_KEY: mock_secret_key
          AWS_DEFAULT_REGION: us-east-1
        run: |
          pytest tests/ -v

