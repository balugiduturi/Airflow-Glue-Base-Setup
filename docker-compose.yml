# ==============================================================================
# AWS Data Engineering Local Development Platform Stack (Production-Grade)
# Services:
#   - postgres:          Airflow metadata database (v15-alpine)
#   - airflow-init:      System resource check, directory permission fix & DB migration
#   - airflow-webserver: Airflow UI dashboard (port 8080)
#   - airflow-scheduler: Airflow workflow scheduler engine
#   - airflow-triggerer: Async triggerer for deferrable operators (S3, Glue sensors)
#   - glue-runner:       AWS Glue 4.0 runtime (JupyterLab, Spark UI, History Server, Livy)
# ==============================================================================

x-airflow-common: &airflow-common
  build:
    context: ./docker/airflow
    dockerfile: Dockerfile
  user: "${AIRFLOW_UID:-50000}:0"
  env_file:
    - .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFfDewgnbL3hOHop8=}
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    AIRFLOW_CONFIG: /opt/airflow/airflow.cfg
    AWS_PROFILE: ${AWS_PROFILE:-giduturi-tutorial-profile}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-south-1}
    S3_RAW_BUCKET: ${S3_RAW_BUCKET:-your-actual-aws-s3-bucket-name}
    S3_PROCESSED_BUCKET: ${S3_PROCESSED_BUCKET:-your-actual-aws-s3-bucket-name}
    S3_CURATED_BUCKET: ${S3_CURATED_BUCKET:-your-actual-aws-s3-bucket-name}
    GLUE_DATABASE_NAME: ${GLUE_DATABASE_NAME:-ecommerce_db}
    GLUE_CRAWLER_NAME: ${GLUE_CRAWLER_NAME:-ecommerce_orders_crawler}
    ATHENA_WORKGROUP: ${ATHENA_WORKGROUP:-primary}
    ATHENA_OUTPUT_LOCATION: ${ATHENA_OUTPUT_LOCATION:-s3://${S3_PROCESSED_BUCKET:-your-actual-aws-s3-bucket-name}/athena_query_results/}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./glue_jobs:/opt/airflow/glue_jobs
    - ./local_data:/opt/airflow/local_data
    - ./config/airflow.cfg:/opt/airflow/airflow.cfg:ro
    - ./scripts:/opt/airflow/scripts
    - ./logs:/opt/airflow/logs
    - /var/run/docker.sock:/var/run/docker.sock
    - ~/.aws:/home/airflow/.aws:ro
  networks:
    - de-network

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL: Airflow Metastore Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-de_base_workspace}-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow} -d ${POSTGRES_DB:-airflow}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - de-network
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Airflow Init: Pre-flight checks, directory permissions & DB migrations
  # ----------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: ${COMPOSE_PROJECT_NAME:-de_base_workspace}-airflow-init
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        if (( mem_available < 3000 )) ; then
          echo -e "\033[1;33m[WARN] Less than 3GB memory available for Docker. Services may encounter OOM.\e[0m"
        fi
        if (( cpus_available < 2 )); then
          echo -e "\033[1;33m[WARN] Less than 2 CPUs available for Docker.\e[0m"
        fi
        echo "[INIT] Creating shared directories and fixing permissions..."
        mkdir -p /opt/airflow/{logs,dags,plugins,config}
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{logs,dags,plugins,config} || true
        echo "[INIT] Running Airflow database migrations..."
        airflow db migrate
        echo "[INIT] Ensuring default admin user exists..."
        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-airflow}" \
          --firstname "${_AIRFLOW_WWW_USER_FIRSTNAME:-Airflow}" \
          --lastname "${_AIRFLOW_WWW_USER_LASTNAME:-Admin}" \
          --role Admin \
          --email "${_AIRFLOW_WWW_USER_EMAIL:-airflow@example.com}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:-airflow}" || true
        echo "[INIT] Airflow initialization completed successfully."
    depends_on:
      postgres:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Airflow Webserver: Web UI Dashboard
  # ----------------------------------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    container_name: ${COMPOSE_PROJECT_NAME:-de_base_workspace}-airflow-webserver
    command: webserver
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Airflow Scheduler: Orchestrator Engine
  # ----------------------------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    container_name: ${COMPOSE_PROJECT_NAME:-de_base_workspace}-airflow-scheduler
    command: scheduler
    healthcheck:
      test: [ "CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\"" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Airflow Triggerer: Async/Deferrable Operator Engine (S3/Glue Sensors)
  # ----------------------------------------------------------------------------
  airflow-triggerer:
    <<: *airflow-common
    container_name: ${COMPOSE_PROJECT_NAME:-de_base_workspace}-airflow-triggerer
    command: triggerer
    healthcheck:
      test: [ "CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"' ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # AWS Glue Runner: PySpark 3.3.0 & Glue 4.0 runtime
  # Ports: 8888 (JupyterLab), 4040 (Spark UI), 18080 (History Server), 8998 (Livy)
  # ----------------------------------------------------------------------------
  glue-runner:
    build:
      context: ./docker/glue
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-de_base_workspace}-glue-runner
    environment:
      - DISABLE_SSL=true
      - DATALAKE_FORMATS=delta
      - AWS_PROFILE=${AWS_PROFILE:-giduturi-tutorial-profile}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-ap-south-1}
    volumes:
      - ./glue_jobs:/home/glue_user/workspace/jupyter_workspace
      - ./local_data:/home/glue_user/workspace/data
      - ./tests:/home/glue_user/workspace/tests
      - ~/.aws:/home/glue_user/.aws:ro
    ports:
      - "${GLUE_JUPYTER_PORT:-8888}:8888"
      - "${SPARK_UI_PORT:-4040}:4040"
      - "${SPARK_HISTORY_PORT:-18080}:18080"
      - "${LIVY_PORT:-8998}:8998"
    networks:
      - de-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  de-network:
    name: ${COMPOSE_PROJECT_NAME:-de_base_workspace}_network
    driver: bridge
